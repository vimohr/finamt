name: Windows installer
on:
  workflow_dispatch:
    inputs:
      with_ai:
        description: Verify the optional model download and local inference
        type: boolean
        default: false
  push:
    branches: [feature/einkommensteuer-installer]

permissions:
  contents: read

jobs:
  setup:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build setup
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r scripts/windows/bootstrap-requirements.txt
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (-not (Test-Path $nsis)) { choco install nsis --yes --no-progress }
          python scripts/windows/build_installer.py --makensis $nsis
      - name: Verify install, installed tax engine and uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/windows/*-setup.exe | Select-Object -First 1
          ./scripts/windows/test_install.ps1 -Installer $setup.FullName
      - name: Verify optional AI setup and local inference
        if: github.event_name == 'push' || inputs.with_ai
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/windows/*-setup.exe | Select-Object -First 1
          ./scripts/windows/test_install.ps1 -Installer $setup.FullName -WithAI
      - uses: actions/upload-artifact@v4
        with:
          name: finamt-windows-x64-setup
          path: dist/windows/*
          if-no-files-found: error
